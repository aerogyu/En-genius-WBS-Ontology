<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#fafafa;--fg:#1f2328;--mut:#6b7280;--line:#d0d7de;--card:#fff;--acc:#2563eb;--hot:#dc2626;--hand:#d97706;--sel:#fde68a;--up:#7c3aed;--dn:#059669;--band:#b0b4ba;--chip:#e8eefb}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#e6e6e6;--mut:#9aa0a6;--line:#363b44;--card:#1f2228;--acc:#60a5fa;--hot:#f87171;--hand:#fbbf24;--sel:#7c5e10;--up:#a78bfa;--dn:#34d399;--band:#c9ccd1;--chip:#243049}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:flex;flex-direction:column}
header{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:16px;margin:0}.mut{color:var(--mut);font-size:12px}
nav{display:flex;gap:4px;padding:6px 14px;border-bottom:1px solid var(--line)}nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:4px 10px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
section{display:none;flex:1;min-height:0}section.on{display:flex}
#gr.on{flex-direction:row}
#tree{width:280px;min-width:200px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--card)}
#tree .bar{padding:6px 8px;border-bottom:1px solid var(--line);display:flex;gap:6px}#tree input[type=text]{flex:1}
#treeBody{flex:1;overflow:auto;padding:4px 0}
.tn{display:flex;align-items:center;gap:4px;padding:2px 6px;cursor:pointer;white-space:nowrap}.tn:hover{background:var(--bg)}.tn.cur{background:var(--sel)}
.tn .tg{width:14px;color:var(--mut);text-align:center;flex:none}.tn .lv{color:var(--mut);font-size:10.5px;flex:none;width:26px}.tn .nm{overflow:hidden;text-overflow:ellipsis}.tn .ct{color:var(--mut);font-size:11px;margin-left:auto;padding-left:6px}
.tn input{margin:0 2px 0 0}
#hits div{padding:3px 8px;cursor:pointer;border-bottom:1px solid var(--line)}#hits div:hover{background:var(--bg)}#hits .p{color:var(--mut);font-size:11px;display:block}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#quick{padding:6px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#quick button,#ctl button.fb{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:3px 9px;border-radius:6px;cursor:pointer;font:inherit}
#ctl{padding:6px 12px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 8px;align-items:center;border-bottom:1px solid var(--line)}
#ctl .k{color:var(--mut)}#ctl .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#ctl button.fb.on{border-color:var(--acc);background:var(--chip)}
select,input{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--fg);padding:3px 10px;cursor:pointer;font:inherit}.seg button.on{background:var(--acc);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:9px;padding:0 8px;font-size:12px}.chip b{font-weight:normal;color:var(--mut)}.chip span.x{cursor:pointer;color:var(--mut)}
#pop{position:absolute;z-index:9;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;width:300px;max-height:60vh;display:none;flex-direction:column;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
#pop .list{overflow:auto;flex:1;min-height:0}#pop label{display:flex;gap:6px;align-items:center;padding:2px 2px;cursor:pointer}#pop label:hover{background:var(--bg)}#pop label .ct{margin-left:auto;color:var(--mut);font-size:11px}
#canvasWrap{flex:1;position:relative;overflow:hidden;background:var(--card)}
#canvas{width:100%;height:100%;cursor:grab;display:block}#canvas:active{cursor:grabbing}
#axis{position:absolute;left:0;top:0;width:100%;height:24px;pointer-events:none;background:var(--card);border-bottom:1px solid var(--line);display:none}
#gantt{position:absolute;inset:0;overflow:auto;display:none;background:var(--card)}
.gg{display:grid;width:max-content;min-width:100%}
.gg .gh{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);height:28px}
.gg .gl{position:sticky;left:0;z-index:1;background:var(--card);border-right:1px solid var(--line)}.gg .gh.gl{z-index:3}
.gr0{display:grid;align-items:center;height:24px;border-bottom:1px solid rgba(127,127,127,.12);cursor:pointer;white-space:nowrap}
.gr0>span{overflow:hidden;text-overflow:ellipsis;padding:0 6px}.gr0 .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px}
.gr0.ghd{font-weight:bold;background:rgba(127,127,127,.07)}.gr0.on{background:var(--sel)}.gr0.up{color:var(--up)}.gr0.dn{color:var(--dn)}
.gg .gh .gr0{height:28px;border:0;cursor:default;color:var(--mut);font-size:12px}
#gantt svg text{font-size:11px}
#legend{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--mut);background:var(--card);padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
#zoom{position:absolute;right:18px;bottom:30px;z-index:5;display:flex;gap:4px}#zoom button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;width:28px;height:28px;cursor:pointer}
#now{padding:5px 12px;border-top:1px solid var(--line);font-size:12px;display:flex;gap:10px;align-items:center}#now .lnk{margin-left:auto;white-space:nowrap}
#side{width:330px;min-width:260px;border-left:1px solid var(--line);overflow:auto;padding:10px 12px;background:var(--card)}
#side h3{margin:8px 0 4px;font-size:13px}#side table{border-collapse:collapse;width:100%}#side td{padding:2px 4px;border-bottom:1px solid var(--line);vertical-align:top}#side td:first-child{color:var(--mut);white-space:nowrap}
.lnk{color:var(--acc);cursor:pointer;text-decoration:underline}.pill{display:inline-block;padding:0 6px;border-radius:9px;background:var(--line);font-size:11px;margin-right:4px}.err{color:var(--hot);font-weight:bold}
#is.on{flex-direction:column;padding:8px 14px;overflow:auto}#is table{border-collapse:collapse}#is td,#is th{border:1px solid var(--line);padding:3px 6px;text-align:left}#is th{background:var(--card);position:sticky;top:0}
svg text{user-select:none}.nd{cursor:pointer}.nd rect{stroke-width:1.5}.nd.dim{opacity:.18}.ed.dim{opacity:.08}.nd.sel rect.bx{stroke-width:3}
</style></head><body>
<header><h1>__TITLE__</h1><span class="mut" id="meta"></span></header>
<nav><button data-t="gr" class="on">① 선후 관계 보기</button><button data-t="is">② 검사</button></nav>
<section id="gr" class="on">
 <div id="tree"><div class="bar"><input type="text" id="q" placeholder="찾기: 번호 · WBS · 이름 일부"><button id="pickClear" title="트리 체크 모두 해제" style="font:inherit">체크 해제</button></div><div id="hits"></div><div id="treeBody"></div></div>
 <div id="main">
  <div id="quick"><span class="mut">빠른 보기</span>
   <button data-q="phase" title="개발 단계 하나를 고르고, 줄은 기술 분야별, 상자는 상위 기술 업무">단계 하나 · 분야별 줄</button>
   <button data-q="disc" title="기술 분야 하나를 고르고, 모든 구성품·모든 단계를 모아 줄은 개발 단계별">분야 하나 · 모든 단계</button>
   <button data-q="level" title="거르기 없이 한 레벨의 요소 전부를 줄 없이">한 레벨 전체 · 줄 없음</button>
   <button data-q="picks" title="왼쪽 트리에서 체크한 항목들만 모아, 줄은 고른 항목별">트리에서 고른 것</button>
   <span style="flex:1"></span><label><input type="checkbox" id="chk"> 가장 긴 사슬</label><label><input type="checkbox" id="ext" checked> 밖 출입</label>
  </div>
  <div id="ctl">
   <span class="k">거르기</span><div class="row" id="filters"></div>
   <span class="k">묶기</span><div class="row"><select id="grain"></select><span class="mut">상자 하나 = 이 레벨 요소 하나</span></div>
   <span class="k">줄 나누기</span><div class="row"><select id="lane"></select><span class="mut">가로 띠를 어느 레벨 이름으로 나눌지</span></div>
   <span class="k">배치</span><div class="row"><span class="seg" id="layout"><button data-v="gantt" class="on">간트</button><button data-v="time">시간표</button><button data-v="flow">흐름도</button></span>
    <span class="seg" id="order" title="간트 행 순서"><button data-v="wbs" class="on">WBS 순</button><button data-v="start">시작일 순</button></span>
    <span class="mut">선</span><span class="seg" id="lines"><button data-v="off">끔</button><button data-v="sel" class="on">고른 것만</button><button data-v="hand">넘겨받기만</button><button data-v="all">전부</button></span><span class="mut" id="stat"></span></div>
  </div>
  <div id="canvasWrap"><div id="gantt"></div><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg><svg id="axis" xmlns="http://www.w3.org/2000/svg"></svg>
   <div id="legend">상자 = 이름표(왼쪽 끝 = 시작일) · 회색 띠 = 실제 기간 · 회색 선 = 같은 줄 안 선행 · <span style="color:var(--hand)">주황</span> = 줄을 넘는 넘겨받기 · 점선 토막 = 거른 범위 밖 · 누름 = 앞(보라)/뒤(초록) · 두 번 누름 = 그 안으로</div>
   <div id="zoom"><button id="zi" title="확대">+</button><button id="zo" title="축소">−</button><button id="zf" title="맞춤">⌂</button></div>
  </div>
  <div id="now"><span id="nowText"></span><span class="lnk" id="copyLink">보기 주소 복사</span></div>
 </div>
 <div id="side"></div>
 <div id="pop"></div>
</section>
<section id="is">
 <div style="margin-bottom:6px">문제 코드 <select id="fIs"></select> <span class="mut" id="isN"></span></div>
 <table id="isT"></table>
</section>
<script>
const D=__DATA__;
const T=new Map(),PRE=new Map(),SUC=new Map(),ROOTS=[];
for(const r of D.tasks){T.set(r[0],{no:r[0],wbs:r[1],lv:r[2],name:r[3].replace(/\s+/g," ").trim(),dur:r[4],st:r[5],fi:r[6],up:r[7],dn:r[8],fl:r[9],cr:r[10],par:r[11],del:r[12],mh:r[13],staff:r[14],kids:[]})}
for(const t of T.values()){if(t.par!=null&&T.has(t.par))T.get(t.par).kids.push(t.no);else ROOTS.push(t.no)}
for(const e of D.edges){(PRE.get(e[1])||PRE.set(e[1],[]).get(e[1])).push(e);(SUC.get(e[0])||SUC.set(e[0],[]).get(e[0])).push(e)}
const LEAF=new Map(),MH=new Map(),CR=new Map(),LEAVES=[];
(function roll(list){for(const no of list){const t=T.get(no);if(!t.kids.length){LEAF.set(no,1);MH.set(no,t.mh||0);CR.set(no,t.cr);LEAVES.push(no);continue}roll(t.kids);let l=0,m=0,c=0;for(const k of t.kids){l+=LEAF.get(k);m+=MH.get(k);c=c||CR.get(k)}LEAF.set(no,l);MH.set(no,m);CR.set(no,c)}})(ROOTS);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const LVNAME={1:"구성품",2:"최상위 업무",3:"개발 단계",4:"기술 분야",5:"상위 기술 업무",6:"하위 기술 업무"};
const PAL=["#4e79a7","#f28e2b","#59a14f","#e15759","#76b7b2","#edc948","#b07aa1","#ff9da7","#9c755f","#bab0ac","#1f77b4","#2ca02c","#d62728","#9467bd","#8c564b","#17becf"];
$("meta").textContent=`${D.source} · 업무 ${D.tasks.length.toLocaleString()} · 선행 관계 ${D.edges.length.toLocaleString()} · 순환 ${D.cycles} · 가장 긴 사슬 ${D.project_days} 근무일(달력 없는 근사) · 문제 ${D.issues.length.toLocaleString()}`;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t))});
function anc(no,lv){let t=T.get(no);while(t&&t.lv>lv&&t.par!=null)t=T.get(t.par);return t?t.no:no}
function ancExact(no,lv){const a=anc(no,lv);return T.get(a).lv===lv?a:null}
function path(no){const p=[];let t=T.get(no);while(t){p.unshift(t);t=t.par!=null?T.get(t.par):null}return p}
function pathText(no){return path(no).map(t=>t.name).join(" › ")}
// 레벨별 이름 목록 (이름 → 잎 수, 요소 수) — 피벗의 선택지
const NAMES={};for(let l=1;l<=5;l++){const m=new Map();for(const t of T.values())if(t.lv===l){const e=m.get(t.name)||{leaves:0,n:0,row:t.no};e.leaves+=LEAF.get(t.no);e.n++;m.set(t.name,e)}NAMES[l]=m}
// ---- 상태 ----
const S={f:{1:null,2:null,3:null,4:null,5:null},picks:new Set(),grain:3,lane:1,layout:"gantt",lines:"sel",order:"wbs",sel:null,ppd:null};
const ROWIDX=new Map(D.tasks.map((r,i)=>[r[0],i])),COLLAPSED=new Set();
function passLeaf(no){for(let l=1;l<=5;l++){const f=S.f[l];if(!f)continue;const a=ancExact(no,l);if(a==null||!f.has(T.get(a).name))return false}
 if(S.picks.size){let ok=false;for(const p of S.picks){if(anc(no,T.get(p).lv)===p){ok=true;break}}if(!ok)return false}return true}
function deepestFilter(){let d=0;for(let l=1;l<=5;l++)if(S.f[l])d=l;return d}
// ---- 트리 (누름 = 그 경로로 거르기, 체크 = 손으로 고르기) ----
const open=new Set();
function renderTree(){const el=$("treeBody");let h="";const rec=(list,d)=>{for(const no of list){const t=T.get(no),has=t.kids.length>0,o=open.has(no);
 h+=`<div class="tn" data-n="${no}" style="padding-left:${6+d*14}px"><span class="tg" data-tg="${no}">${has?(o?"▾":"▸"):"·"}</span><input type="checkbox" data-pk="${no}"${S.picks.has(no)?" checked":""} title="손으로 고르기"><span class="lv">Lv${t.lv}</span><span class="nm" title="${esc(t.wbs+" "+t.name)}">${esc(t.name)}</span><span class="ct">${LEAF.get(no).toLocaleString()}</span></div>`;
 if(has&&o)rec(t.kids,d+1)}};rec(ROOTS,0);el.innerHTML=h;
 el.querySelectorAll(".tg").forEach(x=>x.onclick=ev=>{ev.stopPropagation();const n=+x.dataset.tg;open.has(n)?open.delete(n):open.add(n);renderTree()});
 el.querySelectorAll("input[data-pk]").forEach(x=>{x.onclick=ev=>ev.stopPropagation();x.onchange=()=>{const n=+x.dataset.pk;x.checked?S.picks.add(n):S.picks.delete(n);if(S.picks.size&&S.lane!=="pick"){S.lane="pick"}if(!S.picks.size&&S.lane==="pick")S.lane=0;S.sel=null;syncControls();draw()}});
 el.querySelectorAll(".tn").forEach(x=>x.onclick=()=>pathFilter(+x.dataset.n))}
function pathFilter(no){const t=T.get(no);const p=path(t.kids.length?no:t.par);for(let l=1;l<=5;l++)S.f[l]=null;for(const x of p)if(x.lv<=5)S.f[x.lv]=new Set([x.name]);
 const L=p[p.length-1].lv;S.grain=Math.min(6,L+2);S.lane=L+1<S.grain?L+1:0;S.picks.clear();S.sel=null;for(const x of p)open.add(x.no);
 syncControls();renderTree();draw();if(!t.kids.length)select(no)}
$("pickClear").onclick=()=>{S.picks.clear();if(S.lane==="pick")S.lane=0;syncControls();renderTree();draw()};
$("q").oninput=()=>{const q=$("q").value.trim().toLowerCase();if(!q){$("hits").innerHTML="";return}
 const out=[];for(const t of T.values()){if(String(t.no)===q||t.wbs.toLowerCase().startsWith(q)||t.name.toLowerCase().includes(q)){out.push(t);if(out.length>=40)break}}
 $("hits").innerHTML=out.map(t=>`<div data-n="${t.no}"><span class="pill">Lv${t.lv}</span>${t.no} · ${esc(t.name)}<span class="p">${esc(path(t.no).slice(0,-1).map(x=>x.name).join(" › "))}</span></div>`).join("")||'<div class="mut">없음</div>';
 $("hits").querySelectorAll("div[data-n]").forEach(d=>d.onclick=()=>{$("hits").innerHTML="";$("q").value="";pathFilter(+d.dataset.n)})};
// ---- 조작 줄 ----
function syncControls(){const fl=$("filters");let h="";for(let l=1;l<=5;l++){const f=S.f[l];const txt=!f?"전체":f.size===1?[...f][0]:`${f.size}개`;h+=`<button class="fb${f?" on":""}" data-l="${l}">Lv${l} ${LVNAME[l]} · ${esc(txt)} ▾</button>`}
 h+=`<span class="mut">${S.picks.size?`트리 체크 ${S.picks.size}개`:"트리 체크 0개"}</span>`;fl.innerHTML=h;fl.querySelectorAll(".fb").forEach(b=>b.onclick=ev=>openPop(+b.dataset.l,b));
 const minG=Math.max(2,deepestFilter()+1,...[...S.picks].map(p=>T.get(p).lv+1));if(S.grain<minG)S.grain=minG;
 const g=$("grain");g.innerHTML="";for(let l=Math.max(2,1);l<=6;l++)g.innerHTML+=`<option value="${l}"${l===S.grain?" selected":""}${l<minG?" disabled":""}>Lv${l} ${LVNAME[l]}</option>`;
 const ln=$("lane");ln.innerHTML=`<option value="0"${S.lane===0?" selected":""}>없음</option>`;for(let l=1;l<S.grain&&l<=4;l++)ln.innerHTML+=`<option value="${l}"${S.lane===l?" selected":""}>Lv${l} ${LVNAME[l]} 이름별</option>`;
 if(S.picks.size)ln.innerHTML+=`<option value="pick"${S.lane==="pick"?" selected":""}>고른 항목별</option>`;if(typeof S.lane==="number"&&S.lane>=S.grain)S.lane=0;
 $("layout").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.v===S.layout));
 $("lines").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.v===S.lines));
 $("order").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.v===S.order));$("order").style.display=S.layout==="gantt"?"":"none"}
$("lines").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.lines=b.dataset.v;syncControls();keepView=true;draw()});
$("order").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.order=b.dataset.v;syncControls();keepView=true;draw()});
$("grain").onchange=()=>{S.grain=+$("grain").value;if(typeof S.lane==="number"&&S.lane>=S.grain)S.lane=0;S.sel=null;syncControls();draw()};
$("lane").onchange=()=>{const v=$("lane").value;S.lane=v==="pick"?"pick":+v;S.sel=null;draw()};
$("layout").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.layout=b.dataset.v;syncControls();draw()});
$("chk").onchange=draw;$("ext").onchange=draw;
// 거르기 팝업 — 이름 체크 목록 (잎 수 · 같은 이름 요소 수)
let popLv=0;
function openPop(l,btn){if(popLv===l&&$("pop").style.display==="flex"){closePop();return}popLv=l;const pop=$("pop"),r=btn.getBoundingClientRect(),host=$("gr").getBoundingClientRect();
 pop.style.display="flex";pop.style.left=Math.min(r.left-host.left,host.width-320)+"px";pop.style.top=(r.bottom-host.top+4)+"px";
